<style>
  /* ============ 设计令牌（与日报页同源，此处为全屏深空舞台） ============ */
  :root{
    --bg:#04060A;
    --bg-2:#070B12;
    --panel:rgba(9,14,21,.72);
    --panel-solid:#0A1018;
    --line:rgba(120,150,190,.16);
    --line-2:rgba(120,150,190,.10);
    --ink:#E9EFF7;
    --ink-2:#9AABBF;
    --ink-3:#67788D;
    --accent:#38BDF8;
    --accent-2:#F59E0B;
    --accent-tint:rgba(56,189,248,.13);
    --ease:cubic-bezier(.22,1,.36,1);
    --s25:2px;--s50:4px;--s75:8px;--s100:12px;--s150:16px;
    --s200:20px;--s300:24px;--s400:32px;--s500:40px;
    --r-sm:4px;--r-md:8px;--r-lg:12px;--r-xl:16px;--r-full:9999px;
    --mono:ui-monospace,SFMono-Regular,Menlo,Consolas,"Liberation Mono",monospace;
  }
  *,*::before,*::after{box-sizing:border-box}
  html,body{margin:0;height:100%}
  body{
    background:var(--bg);color:var(--ink);
    font-family:"PingFang SC","HarmonyOS Sans SC","MiSans","Noto Sans SC","Source Han Sans SC","Microsoft YaHei",-apple-system,BlinkMacSystemFont,sans-serif;
    font-size:15px;line-height:1.5;-webkit-font-smoothing:antialiased;overflow:hidden;
  }
  h1,h2,h3,h4{margin:0;font-weight:600;line-height:1.25}
  p{margin:0}
  button{font:inherit;color:inherit;background:none;border:0;cursor:pointer}
  a{color:var(--accent);text-decoration:none}
  a:hover{text-decoration:underline;text-underline-offset:3px}
  :focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:var(--r-sm)}
  .mono{font-family:var(--mono);font-variant-numeric:tabular-nums}
  .sr-only{position:absolute;width:1px;height:1px;overflow:hidden;clip:rect(0 0 0 0)}

  /* ============ 舞台 ============ */
  #stage{position:fixed;inset:0;overflow:hidden;background:
      radial-gradient(120% 90% at 50% -10%,#0B1622 0%,#06090F 45%,#04060A 100%)}
  #view{position:absolute;inset:0;width:100%;height:100%;display:block;touch-action:none}
  #vignette{position:absolute;inset:0;pointer-events:none;
    background:radial-gradient(115% 85% at 50% 45%,rgba(0,0,0,0) 42%,rgba(0,0,0,.55) 100%)}
  #leads{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
  #labels,#dims{position:absolute;inset:0;pointer-events:none}

  /* ============ 通用玻璃面板 ============ */
  .glass{
    background:var(--panel);backdrop-filter:blur(18px) saturate(1.1);
    -webkit-backdrop-filter:blur(18px) saturate(1.1);
    border:1px solid var(--line);border-radius:var(--r-lg);
  }
  .panel-head{display:flex;align-items:center;gap:var(--s75);
    padding:10px 12px;border-bottom:1px solid var(--line-2)}
  .panel-head h2{font-size:12px;font-weight:600;letter-spacing:.06em;color:var(--ink-2);text-transform:uppercase}
  .panel-head .count{margin-left:auto;font-size:11px;color:var(--ink-3)}

  /* ============ 标题区 ============ */
  .hud-title{position:absolute;top:0;left:0;padding:var(--s200) var(--s300);max-width:min(560px,52vw)}
  .hud-title .back{
    display:inline-flex;align-items:center;gap:6px;margin-bottom:14px;
    padding:6px 10px;border-radius:var(--r-md);border:1px solid var(--line);
    background:rgba(9,14,21,.6);font-size:12px;color:var(--ink-2);transition:color .3s var(--ease),border-color .3s var(--ease)}
  .hud-title .back:hover{color:var(--ink);border-color:rgba(120,150,190,.4);text-decoration:none}
  .kicker{display:flex;align-items:center;gap:8px;font-size:11px;letter-spacing:.18em;
    text-transform:uppercase;color:var(--accent);font-family:var(--mono)}
  .kicker .bar{width:26px;height:1px;background:linear-gradient(90deg,var(--accent),transparent)}
  .hud-title h1{margin-top:8px;font-size:clamp(21px,2.2vw,30px);letter-spacing:.01em;
    text-shadow:0 2px 24px rgba(0,0,0,.7)}
  .hud-title h1 em{font-style:normal;color:var(--accent)}
  .hud-title .sub{margin-top:6px;font-size:12.5px;color:var(--ink-2);letter-spacing:.02em}
  .hud-title .sub b{color:var(--ink);font-weight:600}
  .chips{display:flex;flex-wrap:wrap;gap:6px;margin-top:12px}
  .chip{display:inline-flex;align-items:center;gap:5px;padding:3px 8px;border-radius:var(--r-full);
    border:1px solid var(--line);font-size:11px;color:var(--ink-2);background:rgba(9,14,21,.55)}
  .chip i{width:5px;height:5px;border-radius:50%;background:var(--accent);flex:none}
  .chip.amber i{background:var(--accent-2)}

  /* ============ 左：部件清单 ============ */
  .hud-parts{position:absolute;left:var(--s300);top:236px;width:286px;
    max-height:calc(100vh - 400px);display:flex;flex-direction:column;overflow:hidden}
  .hud-parts .list{overflow:auto;padding:6px;scrollbar-width:thin;scrollbar-color:rgba(120,150,190,.32) transparent}
  .hud-parts .list::-webkit-scrollbar{width:6px}
  .hud-parts .list::-webkit-scrollbar-thumb{background:rgba(120,150,190,.28);border-radius:3px}
  .grouplabel{display:flex;align-items:center;gap:6px;padding:8px 8px 4px;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
  .grouplabel::after{content:"";flex:1;height:1px;background:var(--line-2)}
  .part{display:flex;align-items:flex-start;gap:8px;width:100%;text-align:left;
    padding:6px 8px;border-radius:var(--r-md);border:1px solid transparent;
    color:var(--ink-2);transition:background-color .25s var(--ease),color .25s var(--ease),border-color .25s var(--ease)}
  .part:hover{color:var(--ink);background:rgba(255,255,255,.045)}
  .part .no{font-family:var(--mono);font-size:10px;color:var(--ink-3);padding-top:2px;min-width:16px}
  .part .txt{min-width:0;flex:1}
  .part .nm{display:block;font-size:12.5px;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .part .mt{display:block;font-size:10.5px;color:var(--ink-3);overflow:hidden;
    text-overflow:ellipsis;white-space:nowrap;font-family:var(--mono)}
  .part .src{flex:none;margin-top:1px;font-size:9px;font-family:var(--mono);letter-spacing:.04em;
    padding:1px 4px;border-radius:3px;border:1px solid var(--line);color:var(--ink-3)}
  .part .src.est{color:#C79A3F;border-color:rgba(245,158,11,.34)}
  .part[aria-current="true"]{color:var(--ink);background:var(--accent-tint);border-color:rgba(56,189,248,.42)}
  .part[aria-current="true"] .no{color:var(--accent)}

  /* ============ 右：参数 ============ */
  .hud-specs{position:absolute;right:var(--s300);top:var(--s200);width:314px;
    max-height:calc(100vh - 170px);display:flex;flex-direction:column;overflow:hidden;
    transition:max-height .35s var(--ease)}
  body.has-detail .hud-specs{max-height:calc(100vh - 496px)}
  .tabs{display:flex;gap:2px;padding:6px;border-bottom:1px solid var(--line-2)}
  .tab{flex:1;padding:6px 4px;border-radius:var(--r-sm);font-size:11.5px;color:var(--ink-3);
    text-align:center;transition:color .25s var(--ease),background-color .25s var(--ease)}
  .tab:hover{color:var(--ink-2)}
  .tab[aria-selected="true"]{color:var(--accent);background:var(--accent-tint)}
  .panel-body{overflow:auto;padding:12px;scrollbar-width:thin;scrollbar-color:rgba(120,150,190,.32) transparent}
  .panel-body::-webkit-scrollbar{width:6px}
  .panel-body::-webkit-scrollbar-thumb{background:rgba(120,150,190,.28);border-radius:3px}
  .kv{display:grid;grid-template-columns:1fr auto;gap:6px 10px;font-size:12px}
  .kv dt{color:var(--ink-3);min-width:0}
  .kv dd{margin:0;color:var(--ink);font-family:var(--mono);font-size:11.5px;text-align:right;
    font-variant-numeric:tabular-nums;letter-spacing:-.01em}
  .kv dd.hl{color:var(--accent)}
  .kv dt span{display:block;font-size:10px;color:var(--ink-3);opacity:.62;font-family:var(--mono)}
  .sec-title{display:flex;align-items:center;gap:6px;margin:14px 0 8px;font-size:10.5px;
    letter-spacing:.12em;text-transform:uppercase;color:var(--ink-3);font-family:var(--mono)}
  .sec-title:first-child{margin-top:0}
  .sec-title::after{content:"";flex:1;height:1px;background:var(--line-2)}
  .note{font-size:11px;line-height:1.6;color:var(--ink-3)}
  .note b{color:var(--ink-2);font-weight:600}
  .bar-row{display:grid;grid-template-columns:76px 1fr 50px;align-items:center;gap:8px;
    font-size:11px;color:var(--ink-2);margin-bottom:5px}
  .bar-row .track{height:4px;border-radius:2px;background:rgba(120,150,190,.14);overflow:hidden}
  .bar-row .fill{height:100%;border-radius:2px;background:linear-gradient(90deg,rgba(56,189,248,.55),var(--accent));
    transform-origin:left center;animation:grow .9s var(--ease) both}
  .bar-row .fill.amber{background:linear-gradient(90deg,rgba(245,158,11,.5),var(--accent-2))}
  .bar-row .val{text-align:right;font-family:var(--mono);font-variant-numeric:tabular-nums;color:var(--ink)}
  @keyframes grow{from{transform:scaleX(.02)}to{transform:scaleX(1)}}

  /* 选中部件详情卡 */
  .detail{position:absolute;right:var(--s300);bottom:150px;width:314px;
    padding:14px;opacity:0;transform:translateY(8px);pointer-events:none;
    transition:opacity .35s var(--ease),transform .35s var(--ease)}
  .detail.on{opacity:1;transform:none;pointer-events:auto}
  .detail .dhead{display:flex;align-items:baseline;gap:8px;margin-bottom:2px}
  .detail .dno{font-family:var(--mono);font-size:10px;color:var(--accent)}
  .detail h3{font-size:15px}
  .detail .drole{font-size:11px;color:var(--ink-3);margin-bottom:10px}
  .detail .specs{display:grid;gap:4px;font-size:11.5px}
  .detail .spec-row{display:grid;grid-template-columns:78px 1fr;gap:8px}
  .detail .spec-row span{color:var(--ink-3)}
  .detail .spec-row b{font-weight:500;color:var(--ink);font-family:var(--mono);font-size:11px;word-break:break-word}
  .detail .close{position:absolute;top:10px;right:10px;width:22px;height:22px;border-radius:var(--r-sm);
    color:var(--ink-3);display:grid;place-items:center;transition:color .2s var(--ease),background-color .2s var(--ease)}
  .detail .close:hover{color:var(--ink);background:rgba(255,255,255,.07)}

  /* ============ 工具条 ============ */
  .hud-tools{position:absolute;top:var(--s200);left:50%;transform:translateX(-50%);
    display:flex;align-items:center;gap:6px;padding:6px;white-space:nowrap}
  .toolset{display:flex;align-items:center;gap:2px}
  .toolset+.toolset{padding-left:6px;margin-left:2px;border-left:1px solid var(--line-2)}
  .tbtn{padding:6px 9px;border-radius:var(--r-sm);font-size:11.5px;color:var(--ink-3);
    display:inline-flex;align-items:center;gap:5px;transition:color .22s var(--ease),background-color .22s var(--ease)}
  .tbtn:hover{color:var(--ink-2);background:rgba(255,255,255,.05)}
  .tbtn[aria-pressed="true"]{color:var(--accent);background:var(--accent-tint)}
  .tbtn svg{width:13px;height:13px;flex:none}

  /* ============ 时间轴 / 字幕 ============ */
  .hud-timeline{position:absolute;left:50%;bottom:22px;transform:translateX(-50%);
    width:min(620px,calc(100vw - 48px));padding:12px 16px 10px;display:flex;flex-direction:column;gap:8px}
  .tl-top{display:flex;align-items:center;gap:10px}
  .play{width:30px;height:30px;border-radius:50%;display:grid;place-items:center;flex:none;
    border:1px solid rgba(56,189,248,.45);background:rgba(56,189,248,.14);color:var(--accent);
    transition:background-color .25s var(--ease),transform .2s var(--ease)}
  .play:hover{background:rgba(56,189,248,.26)}
  .play:active{transform:scale(.94)}
  .tl-caption{flex:1;min-width:0;font-size:12px;color:var(--ink-2);
    overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
  .tl-caption b{color:var(--ink);font-weight:600}
  .tl-range{position:relative;display:flex;align-items:center;gap:10px}
  .tl-range input[type=range]{-webkit-appearance:none;appearance:none;flex:1;height:3px;border-radius:2px;
    background:linear-gradient(90deg,var(--accent) 0%,var(--accent) var(--pct,0%),rgba(120,150,190,.2) var(--pct,0%),rgba(120,150,190,.2) 100%);
    outline:none;cursor:pointer}
  .tl-range input[type=range]::-webkit-slider-thumb{-webkit-appearance:none;width:12px;height:12px;border-radius:50%;
    background:#EAF6FF;border:2px solid var(--accent);box-shadow:0 0 12px rgba(56,189,248,.7);cursor:grab}
  .tl-range input[type=range]::-moz-range-thumb{width:11px;height:11px;border-radius:50%;
    background:#EAF6FF;border:2px solid var(--accent)}
  .tl-range .ends{display:flex;justify-content:space-between;font-size:10px;color:var(--ink-3);
    font-family:var(--mono);letter-spacing:.08em;flex:none;gap:8px}

  /* ============ 标注胶囊 ============ */
  .lbl{position:absolute;left:0;top:0;display:flex;align-items:center;gap:6px;padding:3px 8px;
    border-radius:var(--r-full);border:1px solid rgba(120,150,190,.26);
    background:rgba(7,11,17,.86);font-size:11px;color:var(--ink-2);white-space:nowrap;
    transform:translate(-50%,-50%);opacity:0;transition:opacity .3s var(--ease),border-color .3s var(--ease),color .3s var(--ease);
    box-shadow:0 4px 18px rgba(0,0,0,.5)}
  .lbl.on{opacity:1}
  .lbl .dot{width:4px;height:4px;border-radius:50%;background:var(--accent);flex:none;box-shadow:0 0 8px var(--accent)}
  .lbl .nm{color:var(--ink)}
  .lbl .vl{color:var(--accent);font-family:var(--mono);font-size:10.5px}
  .lbl.est .dot{background:var(--accent-2);box-shadow:0 0 8px var(--accent-2)}
  .lbl.est .vl{color:var(--accent-2)}
  .lbl.sel{border-color:var(--accent);color:var(--ink)}
  .dimg{position:absolute;left:0;top:0;transform:translate(-50%,-50%);
    font-family:var(--mono);font-size:10.5px;letter-spacing:.02em;color:#BFE8FF;
    padding:1px 6px;border-radius:3px;background:rgba(4,8,12,.72);
    border:1px solid rgba(56,189,248,.3);opacity:0;transition:opacity .3s var(--ease);white-space:nowrap}
  .dimg.on{opacity:1}
  .dimg.est{color:#F3CE8A;border-color:rgba(245,158,11,.34)}

  /* ============ 载入 ============ */
  #loader{position:absolute;inset:0;display:grid;place-items:center;background:var(--bg);
    transition:opacity .6s var(--ease);z-index:20}
  #loader.off{opacity:0;pointer-events:none}
  .load-inner{text-align:center}
  .load-inner .lg{font-family:var(--mono);font-size:11px;letter-spacing:.24em;color:var(--accent);text-transform:uppercase}
  .load-inner .bar{margin:14px auto 0;width:180px;height:2px;background:rgba(120,150,190,.2);overflow:hidden;border-radius:2px}
  .load-inner .bar i{display:block;height:100%;width:36%;background:var(--accent);
    animation:slide 1.1s var(--ease) infinite}
  @keyframes slide{0%{transform:translateX(-100%)}100%{transform:translateX(380%)}}
  .fallback{position:absolute;inset:0;display:grid;place-items:center;padding:32px;text-align:center;
    color:var(--ink-2);font-size:14px}

  /* ============ 影院模式：面板让位，画面满幅 ============ */
  .hud-title, .hud-parts, .hud-specs, .hud-timeline { transition: opacity .45s var(--ease), transform .45s var(--ease) }
  body.cinema .hud-parts { opacity: 0; transform: translateX(-20px); pointer-events: none }
  body.cinema .hud-specs { opacity: 0; transform: translateX(20px); pointer-events: none }
  body.cinema .hud-title .sub, body.cinema .hud-title .chips { opacity: 0 }
  body.cinema .hud-title h1 { font-size: clamp(17px, 1.5vw, 22px) }
  body.cinema .hud-title .back { opacity: 0 }
  body.cinema .detail { opacity: 0; pointer-events: none }
  body.cinema .hud-timeline { width: min(760px, calc(100vw - 48px)) }

  /* ============ 折叠 / 响应式 ============ */
  .collapse{position:absolute;top:8px;right:8px;width:22px;height:22px;border-radius:var(--r-sm);
    color:var(--ink-3);display:none}
  @media (max-width:1180px){
    .hud-parts{width:250px;top:224px}
    .hud-specs{width:286px}
    .detail{width:286px}
  }
  /* 小屏：舞台上移为固定高度，侧栏收起，只留标注、时间轴与点击详情 */
  @media (max-width:900px){
    body{overflow:auto;height:auto}
    #stage{position:relative;height:auto;min-height:100vh;display:flex;flex-direction:column}
    #view{position:absolute;inset:0;height:66vh}
    .hud-title{position:relative;padding:14px 14px 6px;max-width:none;order:0}
    .hud-title h1{font-size:20px}
    .hud-title .sub{font-size:11.5px}
    .hud-title .chips{margin-top:8px}
    .hud-parts{display:none}
    .hud-specs{position:relative;inset:auto;width:auto;margin:12px;max-height:none;order:3}
    .hud-tools{position:absolute;top:auto;bottom:auto;left:8px;right:8px;transform:none;
      top:calc(66vh - 46px);overflow-x:auto;max-width:calc(100vw - 16px);justify-content:flex-start}
    .hud-timeline{position:absolute;transform:none;left:8px;right:8px;width:auto;
      top:calc(66vh - 104px)}
    .detail{position:relative;inset:auto;width:auto;margin:12px;order:2;
      opacity:1;transform:none;pointer-events:auto;display:none}
    .detail.on{display:block}
    body.cinema .hud-specs,body.cinema .detail{display:none}
    body.cinema #stage{min-height:100vh}
    #labels{z-index:2}
  }
  @media (prefers-reduced-motion:reduce){
    *{animation-duration:.01ms !important;transition-duration:.01ms !important}
  }
</style>

  <svg id="leads" aria-hidden="true"></svg>

  <div id="dims" aria-hidden="true"></div>

  <!-- 标题 -->
  <div class="hud-title">
    <a class="back" href="./index.html">
      <svg width="14" height="14" viewBox="0 0 20 20" fill="none" stroke="currentColor" stroke-width="1.6" stroke-linecap="round" stroke-linejoin="round"><path d="M11 5l-5 5 5 5M6 10h9"/></svg>
      返回日报
    </a>
    <div class="kicker"><span class="bar"></span>Hall Electric Propulsion · PPCU</div>
    <h1>霍尔电推进系统 <em>三维拆解</em></h1>
    <p class="sub"><b>1:1 毫米级</b> · 机箱包络 325 × 257 × 150 mm · 42 V 母线 / 1100 W 负载 / 氪工质</p>

<script type="module">
import * as THREE from './vendor/three.module.min.js';
/* =====================================================================
   霍尔电推进系统（PPCU + 推力器头部）三维拆解
   ---------------------------------------------------------------------
   比例尺：1 场景单位 = 1 mm（真实尺寸建模）
   数据来源：招标编号 OITC-G260302311 投标文件
     · 招标文件第八部分 2.2 / 2.3 / 2.4 / 2.5 / 2.6 的逐条应答（第三部分 3.1.3～3.1.6）
     · 表 3-3 稳态负载功率分配、表 3-4 损耗预算、表 3-5 质量预算
     · 2.10 货物技术说明文件（技术规格书）结构接口 / 电气接口表
   机身坐标：X 为机箱长度方向（+X 朝推力器与对外接插件），Y 向上，Z 为深度
   ===================================================================== */

/* ---------- 尺寸常量（全部来自招标文件） ---------- */
var DIM = {
  W: 325,          // 结构外形最大包络 X（含接插件与安装支耳）  2.2.4 / 2.6.1
  D: 257,          // 包络 Z
  H: 150,          // 包络 Y
  BASE: 6,         // 安装底板厚度 = 安装支耳厚度 6±0.1 mm      2.6.2
  LID: 6,          // 上盖厚度（按底板同厚度建模）
  WALL: 3,         // 机箱侧壁厚（铝合金 7075-T73 整体机加）
  BW: 300,         // 侧壁外廓 X（其余留给安装法兰与侧插接插件）
  BD: 232          // 侧壁外廓 Z
};

var P = {
  BX: DIM.BW, BZ: DIM.BD,
  INX: DIM.BW - 2 * DIM.WALL,          // 内腔 294
  INZ: DIM.BD - 2 * DIM.WALL,          // 内腔 226
  Y0: DIM.BASE,                        // 底板顶面 y=6
  YTOP: DIM.H - DIM.LID                // 侧壁顶面 y=144
};

/* 推力器头部（招标文件只给接口关系，外形为工程估算，界面已标注） */
var T = {
  x0: 330,        // 安装法兰后端面 X
  y0: 100,        // 轴线高度
  OD: 56.5,       // 屏蔽罩外半径 → 外径约 113
  chanIn: 33, chanOut: 45   // 陶瓷通道 φ66/φ90，平均直径 φ78、通道宽 12、深 28
};

var MM = 1;

/* ---------- 材质 ---------- */
var ENVMAP = null;
var M = {
  alu:      new THREE.MeshStandardMaterial({ color: 0x9AA5B2, metalness: 0.85, roughness: 0.46 }),
  aluDark:  new THREE.MeshStandardMaterial({ color: 0x5C6672, metalness: 0.88, roughness: 0.44 }),
  aluWarm:  new THREE.MeshStandardMaterial({ color: 0xAEB8C2, metalness: 0.9, roughness: 0.36 }),
  black:    new THREE.MeshStandardMaterial({ color: 0x1D242B, metalness: 0.55, roughness: 0.58 }),
  blackSoft:new THREE.MeshStandardMaterial({ color: 0x11151B, metalness: 0.25, roughness: 0.8 }),
  pcb:      new THREE.MeshStandardMaterial({ color: 0x14402F, metalness: 0.3, roughness: 0.55 }),
  pcbDark:  new THREE.MeshStandardMaterial({ color: 0x0E3324, metalness: 0.26, roughness: 0.6 }),
  ferrite:  new THREE.MeshStandardMaterial({ color: 0x23272E, metalness: 0.34, roughness: 0.72 }),
  copper:   new THREE.MeshStandardMaterial({ color: 0xC08447, metalness: 1.0, roughness: 0.32 }),
  copperDk: new THREE.MeshStandardMaterial({ color: 0x8E5F2F, metalness: 1.0, roughness: 0.42 }),
  ceramic:  new THREE.MeshStandardMaterial({ color: 0xE9E6DB, metalness: 0.02, roughness: 0.86 }),
  softMag:  new THREE.MeshStandardMaterial({ color: 0xA9B4BF, metalness: 0.98, roughness: 0.3 }),
  steel:    new THREE.MeshStandardMaterial({ color: 0x8D96A0, metalness: 0.96, roughness: 0.34 }),
  gold:     new THREE.MeshStandardMaterial({ color: 0xD9AE5E, metalness: 1.0, roughness: 0.26 }),
  chipBody: new THREE.MeshStandardMaterial({ color: 0x0B0E13, metalness: 0.35, roughness: 0.55 }),
  capacitor:new THREE.MeshStandardMaterial({ color: 0x1B2733, metalness: 0.55, roughness: 0.45 }),
  hvRed:    new THREE.MeshStandardMaterial({ color: 0x8C3A2E, metalness: 0.4, roughness: 0.5 }),
  shield:   new THREE.MeshStandardMaterial({ color: 0x8A96A3, metalness: 0.9, roughness: 0.38,
              transparent: true, opacity: 0.34, side: THREE.DoubleSide }),
  glowC:    new THREE.MeshBasicMaterial({ color: 0x38BDF8 }),
  glowA:    new THREE.MeshBasicMaterial({ color: 0xF59E0B }),
  glowW:    new THREE.MeshBasicMaterial({ color: 0xBFE9FF }),
  wireDark: new THREE.MeshStandardMaterial({ color: 0x1A1F27, metalness: 0.3, roughness: 0.8 })
};
Object.keys(M).forEach(function (k) { if (M[k].isMeshStandardMaterial) M[k].envMapIntensity = 1.15; });

/* ---------- 几何小工具 ---------- */
function boxM(w, h, d, mat) { return new THREE.Mesh(new THREE.BoxGeometry(w, h, d), mat); }
function cylM(rt, rb, h, mat, seg) {
  return new THREE.Mesh(new THREE.CylinderGeometry(rt, rb, h, seg || 32), mat);
}
/* 圆环：内孔 + 外圆的挤出体，几何居中，轴向 = +Z */
function ringM(rIn, rOut, h, mat, seg) {
  var sh = new THREE.Shape();
  sh.absarc(0, 0, rOut, 0, Math.PI * 2, false);
  var hole = new THREE.Path();
  hole.absarc(0, 0, rIn, 0, Math.PI * 2, true);
  sh.holes.push(hole);
  var g = new THREE.ExtrudeGeometry(sh, { depth: h, bevelEnabled: false, curveSegments: seg || 56 });
  g.translate(0, 0, -h / 2);
  return new THREE.Mesh(g, mat);
}
/* 轴向助手：+Z → +X / +Z → +Y；+Y → +X（圆柱与螺旋） */
function ringX(m) { m.rotation.y = Math.PI / 2; return m; }
function ringY(m) { m.rotation.x = -Math.PI / 2; return m; }
function toX(m) { m.rotation.z = -Math.PI / 2; return m; }

/* 螺旋线圈（沿 Y 生成，需自行转向） */
function helixM(rMean, wire, len, turns, mat) {
  var N = Math.max(60, Math.round(turns * 20));
  var pts = [];
  for (var i = 0; i <= N; i++) {
    var t = i / N, a = t * turns * Math.PI * 2;
    pts.push(new THREE.Vector3(rMean * Math.cos(a), t * len, rMean * Math.sin(a)));
  }
  var curve = new THREE.CatmullRomCurve3(pts);
  return new THREE.Mesh(new THREE.TubeGeometry(curve, N, wire, 7, false), mat);
}
/* 叠层绕组（假装线包） */
function windingM(w, h, d, layers, mat, gap) {
  var g = new THREE.Group();
  var t = h / layers;
  for (var i = 0; i < layers; i++) {
    var s = boxM(w, t * (gap || 0.6), d, mat);
    s.position.y = -h / 2 + t * (i + 0.5);
    g.add(s);
  }
  return g;
}
/* 螺丝头 */
function screwM(r, x, y, z) {
  var m = cylM(r, r, 1.6, M.aluDark, 10);
  m.position.set(x, y, z);
  return m;
}

/* =====================================================================
   推力器头部（A 组）
   ===================================================================== */
function thrGroup() { var g = new THREE.Group(); g.position.set(0, T.y0, 0); return g; }

function buildThrFlange() {
  var g = thrGroup();
  var f = ringX(ringM(26, 62, 8, M.alu)); f.position.x = 334;  // 330..338
  g.add(f);
  // 4 × M5 安装孔 + 螺栓
  for (var i = 0; i < 4; i++) {
    var a = Math.PI / 4 + i * Math.PI / 2;
    var hx = 334, hy = 50 * Math.cos(a), hz = 50 * Math.sin(a);
    var hole = toX(cylM(2.6, 2.6, 9, M.blackSoft, 12));
    hole.position.set(hx, hy, hz); g.add(hole);
    var bo = toX(cylM(4.2, 4.2, 3, M.steel, 6));
    bo.position.set(338, hy, hz); g.add(bo);
  }
  return g;
}

function buildThrShield() {
  var g = thrGroup();
  var shell = ringX(ringM(54.5, 56.5, 34, M.steel)); shell.position.x = 355; g.add(shell);
  var back = ringX(ringM(26, 56.5, 3, M.steel)); back.position.x = 339.5; g.add(back);
  // 屏蔽罩上的加强筋 + 接地点
  for (var i = 0; i < 6; i++) {
    var a = i * Math.PI / 3;
    var rib = boxM(34, 2.4, 3, M.aluDark);
    rib.position.set(355, 55.5 * Math.cos(a), 55.5 * Math.sin(a));
    rib.rotation.x = a; g.add(rib);
  }
  var gnd = boxM(4, 6, 4, M.gold); gnd.position.set(348, 0, 57.5); g.add(gnd);
  return g;
}

function buildThrBack() {
  var g = thrGroup();
  var d = toX(cylM(54, 54, 8, M.softMag)); d.position.x = 345; g.add(d);   // 341..349
  // 磁背板上的走线槽
  for (var i = 0; i < 4; i++) {
    var a = i * Math.PI / 2 + 0.4;
    var s = boxM(9, 6, 4, M.blackSoft);
    s.position.set(345, 30 * Math.cos(a), 30 * Math.sin(a)); g.add(s);
  }
  return g;
}

function buildThrPoleOuter() {
  var g = thrGroup();
  var p = ringX(ringM(45.5, 50, 19, M.softMag)); p.position.x = 358.5; g.add(p);  // 349..368
  // 外磁极端面倒角装饰环
  var e = ringX(ringM(45.5, 50, 1.6, M.aluWarm)); e.position.x = 368; g.add(e);
  return g;
}

function buildThrPoleInner() {
  var g = thrGroup();
  var cup = ringX(ringM(27, 33, 35, M.softMag)); cup.position.x = 366.5; g.add(cup); // 349..384
  var post = toX(cylM(9, 9, 35, M.softMag)); post.position.x = 366.5; g.add(post);
  var face = ringX(ringM(9, 33, 8, M.softMag)); face.position.x = 388; g.add(face); // 384..392
  var rimm = ringX(ringM(30, 33, 1.4, M.aluWarm)); rimm.position.x = 392.7; g.add(rimm);
  return g;
}

function buildThrChannel() {
  var g = thrGroup();
  var ch = ringX(ringM(T.chanIn, T.chanOut, 28, M.ceramic)); ch.position.x = 374; g.add(ch); // 360..388
  // 通道出口端面的分段线（BN-SiO2 陶瓷环拼接）
  for (var i = 0; i < 8; i++) {
    var a = i * Math.PI / 4;
    var seg = boxM(2, 12, 1.2, M.blackSoft);
    seg.position.set(387, 39 * Math.cos(a), 39 * Math.sin(a));
    seg.rotation.x = a; g.add(seg);
  }
  return g;
}

function buildThrAnode() {
  var g = thrGroup();
  var a = ringX(ringM(T.chanIn, T.chanOut, 3, M.steel)); a.position.x = 361.5; g.add(a); // 360..363
  // 24 × φ0.6 mm 气体分配孔（2.10 第 4 节 / 阳极分配器）
  for (var i = 0; i < 24; i++) {
    var ang = i * Math.PI * 2 / 24;
    var h = toX(cylM(0.9, 0.9, 3.6, M.blackSoft, 8));
    h.position.set(360.5, 39 * Math.cos(ang), 39 * Math.sin(ang)); g.add(h);
  }
  // 氪气进气管（从磁背板中心引入）
  var pipe = toX(cylM(2.4, 2.4, 22, M.steel)); pipe.position.x = 348; g.add(pipe);
  var hub = toX(cylM(5, 5, 5, M.steel)); hub.position.x = 380; g.add(hub);
  for (var k = 0; k < 6; k++) {
    var ang2 = k * Math.PI / 3;
    var spoke = boxM(14, 2, 2.6, M.steel);
    spoke.position.set(384, 22 * Math.cos(ang2), 22 * Math.sin(ang2));
    spoke.rotation.x = ang2; g.add(spoke);
  }
  return g;
}

function buildThrCoilOuter() {
  var g = thrGroup();
  var c = toX(helixM(52.4, 1.45, 20, 26, M.copper)); c.position.x = 350; g.add(c);
  var f = ringX(ringM(51, 54, 3, M.aluDark)); f.position.x = 351.5; g.add(f);   // 线包骨架
  var f2 = ringX(ringM(51, 54, 3, M.aluDark)); f2.position.x = 368.5; g.add(f2);
  var lead = boxM(2.4, 2.4, 16, M.copperDk); lead.position.set(352, 54, 22); g.add(lead);
  return g;
}

function buildThrCoilInner() {
  var g = thrGroup();
  var c = toX(helixM(18, 1.4, 28, 30, M.copper)); c.position.x = 352; g.add(c);
  var f = ringX(ringM(16.5, 19.5, 2.4, M.aluDark)); f.position.x = 353.2; g.add(f);
  var f2 = ringX(ringM(16.5, 19.5, 2.4, M.aluDark)); f2.position.x = 378.2; g.add(f2);
  var lead = boxM(12, 2, 2, M.copperDk); lead.position.set(348, 0, 18); g.add(lead);
  return g;
}

function buildThrCathode() {
  var g = thrGroup();
  [-32, 32].forEach(function (dz) {
    var body = toX(cylM(10, 10, 30, M.aluWarm)); body.position.set(414, -52, dz); g.add(body);
    var nose = toX(cylM(4, 10, 8, M.aluWarm)); nose.position.set(433, -52, dz); g.add(nose);
    var tip = toX(cylM(1.8, 3.2, 5, M.steel)); tip.position.set(438.5, -52, dz); g.add(tip);
    // 加热丝（通电发热，恒流 0～5 A 可调）
    var htr = ringX(ringM(6.5, 8.2, 10, M.hvRed)); htr.position.set(409, -52, dz); g.add(htr);
    var hglow = ringX(ringM(8.2, 8.8, 8, M.glowW)); hglow.position.set(409, -52, dz);
    hglow.userData.noPick = true; g.add(hglow);
    // 阴极引线
    var w1 = boxM(34, 1.8, 1.8, M.wireDark); w1.position.set(420, -44, dz + 6); g.add(w1);
    var w2 = boxM(34, 1.8, 1.8, M.wireDark); w2.position.set(420, -44, dz - 6); g.add(w2);
  });
  // 阴极座与支撑臂
  var seat = boxM(20, 10, 88, M.alu); seat.position.set(398, -52, 0); g.add(seat);
  var arm = boxM(46, 7, 10, M.alu); arm.position.set(362, -46, 0); g.add(arm);
  var arm2 = boxM(9, 46, 9, M.alu); arm2.position.set(340, -24, 0); g.add(arm2);
  return g;
}

/* 羽流：加法混合的等离子体羽流（自定义着色器，径向 + 轴向衰减） */
var plume = null;
function buildPlume() {
  var g = new THREE.Group();
  var len = 300, seg = 56, ringN = 44;
  var pos = [], uv = [], idx = [];
  for (var i = 0; i <= ringN; i++) {
    var t = i / ringN;
    var r = 34 + 96 * Math.pow(t, 0.78);
    var x = T.x0 + 68 + t * len;
    for (var j = 0; j <= seg; j++) {
      var a = j / seg * Math.PI * 2;
      pos.push(x, T.y0 + r * Math.cos(a), r * Math.sin(a));
      uv.push(t, j / seg);
    }
  }
  for (var i2 = 0; i2 < ringN; i2++) {
    for (var j2 = 0; j2 < seg; j2++) {
      var a0 = i2 * (seg + 1) + j2, b0 = a0 + seg + 1;
      idx.push(a0, b0, a0 + 1, b0, b0 + 1, a0 + 1);
    }
  }
  var geo = new THREE.BufferGeometry();
  geo.setAttribute('position', new THREE.Float32BufferAttribute(pos, 3));
  geo.setAttribute('uv', new THREE.Float32BufferAttribute(uv, 2));
  geo.setIndex(idx);

  var mat = new THREE.ShaderMaterial({
    transparent: true, depthWrite: false, blending: THREE.AdditiveBlending,
    side: THREE.DoubleSide,
    uniforms: {
      uExit: { value: T.x0 + 68 }, uLen: { value: len },
      uTime: { value: 0 }, uOpacity: { value: 1 }
    },
    vertexShader: [
      'varying vec3 vPos;',
      'void main(){ vPos = position; gl_Position = projectionMatrix * modelViewMatrix * vec4(position,1.0); }'
    ].join('\n'),
    fragmentShader: [
      'uniform float uExit; uniform float uLen; uniform float uTime; uniform float uOpacity;',
      'varying vec3 vPos;',
      'void main(){',
      '  float t = clamp((vPos.x - uExit) / uLen, 0.0, 1.0);',
      '  float rMax = 34.0 + 96.0 * pow(t, 0.78);',
      '  float rho = length(vPos.yz) / max(rMax, 0.001);',
      '  float axial = pow(1.0 - t, 1.7);',
      '  float radial = pow(max(0.0, 1.0 - rho * rho), 1.5);',
      '  float flick = 0.86 + 0.14 * sin(uTime * 6.0 + t * 26.0);',
      '  float a = axial * radial * 0.42 * flick * uOpacity;',
      '  vec3 cold = vec3(0.62, 0.86, 1.0);',
      '  vec3 hot  = vec3(0.22, 0.58, 1.0);',
      '  vec3 col = mix(cold, hot, smoothstep(0.0, 0.62, t));',
      '  col += vec3(0.18, 0.22, 0.26) * pow(axial, 6.0);',
      '  gl_FragColor = vec4(col, a);',
      '}'
    ].join('\n')
  });
  plume = new THREE.Mesh(geo, mat);
  g.add(plume);
  g.userData.noPick = true;
  return g;
}

function pcbSlab(w, d, y, mat) {
  var m = boxM(w, 2, d, mat || M.pcb);

}
function chip(w, h, d, x, y, z, mat) {
  var m = boxM(w, h, d, mat || M.chipBody);

}
function capV(r, h, x, y, z, mat) {
  var m = cylM(r, r, h, mat || M.capacitor, 14);
  m.position.set(x, y + h / 2, z);
  return m;
}
function capH(r, len, x, y, z, mat) {   // 卧式电容，沿 X
  var m = cylM(r, r, len, mat || M.capacitor, 14);
  m.rotation.z = Math.PI / 2; m.position.set(x, y, z);

}
function toroidInd(rIn, rOut, h, x, y, z, windMat) {
  var g = new THREE.Group();
  g.add(ringY(ringM(rIn, rOut, h, M.ferrite, 36)));
  var rMid = (rIn + rOut) / 2, wire = (rOut - rIn) * 0.34;
  var w = new THREE.Mesh(new THREE.TorusGeometry(rMid, wire, 8, 32), windMat || M.copper);
  w.rotation.x = Math.PI / 2; g.add(w);
  g.position.set(x, y, z);

}
function heatsink(w, h, d, x, y, z, fins) {
  var g = new THREE.Group();
  var base = boxM(w, h * 0.4, d, M.alu);
  base.position.y = h * 0.2; g.add(base);
  var n = fins || 7;

    var f = boxM(w, h * 0.6, 1.6, M.alu);
    f.position.set(0, h * 0.6, -d / 2 + d * (i + 0.5) / n);
    g.add(f);
  }
  g.position.set(x, y, z);
  return g;
}
function transformer(cw, ch, cl, x, y, z, turns) {
  var g = new THREE.Group();

  var legB = boxM(cw * 0.16, ch - 18, cl, M.ferrite); legB.position.set(cw * 0.4, ch / 2, 0); g.add(legB);
  // 原/副边绕组
  var wd = windingM(cw * 0.34, ch - 26, cl * 0.72, turns || 7, M.copper, 0.72);

  wd2.position.set(cw * 0.19, ch / 2, 0); wd2.rotation.y = Math.PI / 2; g.add(wd2);
  g.position.set(x, y, z);
  return g;

    g.add(chip(4, 6, 4, cx - 7, y + 2, cz, M.steel));
    var u = capV(3, 8, cx + 8, y + 2, cz + 10, M.capacitor);
    g.add(u);
  }
  // 储能电容组
  for (var k = 0; k < 4; k++) g.add(capV(5, 18, 84, y + 2, -40 + k * 26, M.capacitor));
  // 压力计差分采集 ≥8 路 + 供电 LDO
  for (var m = 0; m < 8; m++) {
    g.add(chip(9, 3, 7, 76 + (m % 2) * 16, y + 2, 52 + Math.floor(m / 2) * 12, M.chipBody));
  }
  // 热敏电阻 4 路
  for (var n = 0; n < 4; n++) g.add(chip(4, 2, 4, 108, y + 2, 20 + n * 10, M.aluWarm));
  // 板间连接器
  g.add(chip(14, 5, 30, 78, y + 2, -96, M.steel));
  return g;
}

function buildShieldCan() {   // 高压屏蔽腔（阳极高压区局部屏蔽）
  var g = new THREE.Group();
  var x0 = 6, x1 = 148, z0 = -104, z1 = 104, y0 = 56, y1 = 86;
  var mat = M.shield;
  var top = boxM(x1 - x0, 1.5, z1 - z0, mat); top.position.set((x0 + x1) / 2, y1, (z0 + z1) / 2); g.add(top);
  var sideA = boxM(1.5, y1 - y0, z1 - z0, mat); sideA.position.set(x0, (y0 + y1) / 2, (z0 + z1) / 2); g.add(sideA);
  var sideB = boxM(1.5, y1 - y0, z1 - z0, mat); sideB.position.set(x1, (y0 + y1) / 2, (z0 + z1) / 2); g.add(sideB);
  var sideC = boxM(x1 - x0, y1 - y0, 1.5, mat); sideC.position.set((x0 + x1) / 2, (y0 + y1) / 2, z0); g.add(sideC);
  var sideD = boxM(x1 - x0, y1 - y0, 1.5, mat); sideD.position.set((x0 + x1) / 2, (y0 + y1) / 2, z1); g.add(sideD);
  return g;
}

function buildCarrier() {   // 内部导热衬板（功率器件直接压接底板）
  var g = new THREE.Group();
  var plate = boxM(288, 5, 220, M.aluWarm); plate.position.y = 8.5; g.add(plate);
  // 导热绝缘垫
  var pad = boxM(270, 1.2, 200, M.hvac || M.aluDark); pad.position.y = 11.6; pad.material = M.aluDark; g.add(pad);
  // 加强筋
  for (var i = 0; i < 3; i++) {
    var r = boxM(280, 3, 4, M.alu); r.position.set(0, 6.5, -70 + i * 70); g.add(r);
  }
  return g;
}

/* ---------- 线束：J599 推力器供电 + 低频信号 ---------- */
function buildHarness() {
  var g = new THREE.Group();
  function tube(pts, r, mat) {
    var curve = new THREE.CatmullRomCurve3(pts.map(function (p) { return new THREE.Vector3(p[0], p[1], p[2]); }));
    return new THREE.Mesh(new THREE.TubeGeometry(curve, 60, r, 8, false), mat);
  }
  // 功率线束（阳极 + 阴极/励磁）
  g.add(tube([[163, 104, -74], [200, 130, -74], [250, 140, -50], [300, 120, -10], [330, 100, -30]], 4.6, M.wireDark));
  g.add(tube([[163, 100, -34], [205, 122, -34], [255, 136, -24], [300, 112, 6], [332, 100, -8]], 3.8, M.wireDark));
  // 信号线束（RS-422 / OC 到星务，示意走向）
  g.add(tube([[163, 118, 62], [205, 132, 84], [250, 96, 118], [300, 60, 120]], 2.6, M.wireDark));
  // 卡箍
  var clamp1 = boxM(10, 12, 26, M.aluDark); clamp1.position.set(250, 138, -52); g.add(clamp1);
  var clamp2 = boxM(10, 12, 22, M.aluDark); clamp2.position.set(250, 100, 118); g.add(clamp2);
  return g;
}

function layoutDims() {
  var W = canvas.getBoundingClientRect().width;
  DIMS.forEach(function (d) {
    if (!(showDims && explode < 0.3)) return;

    var el = d.el;
    if (!s.vis) { el.classList.remove('on'); return; }
    el.classList.add('on');
    var w = el.offsetWidth || 80, h = el.offsetHeight || 18;
    var pl = cinema ? 40 : 320, pr = cinema ? 40 : 348;
    var x = Math.max(pl + w / 2, Math.min(W - pr - w / 2, s.x));
    el.style.transform = 'translate(' + (x - w / 2) + 'px,' + (s.y - h / 2) + 'px)';

var demo = { on: false, idx: 0, t: 0 };
var playBtn = document.getElementById('btnPlay');
var playIcon = document.getElementById('playIcon');
var captionEl = document.getElementById('caption');
var explEl = document.getElementById('explode');
var pctEl = document.getElementById('expPct');

function setCaption(html) { captionEl.innerHTML = html; }
function runDemoStep(i, instant) {
  var s = DEMO[i];
  if (s.view) applyView(s.view, instant);
  if (typeof s.explode === 'number') explodeTarget = s.explode;
  if (s.focus) setTimeout(function () { if (demo.on || instant) focusOn(s.focus, 3.4); }, instant ? 0 : 260);
  setCaption(s.cap);
}
function startDemo() {
  demo.on = true; demo.idx = 0; demo.t = 0;
  if (typeof setCinema === 'function') setCinema(true);
  playIcon.innerHTML = '<rect x="5" y="4" width="3.4" height="12" rx="1"/><rect x="11.6" y="4" width="3.4" height="12" rx="1"/>';
  playBtn.setAttribute('aria-label', '暂停演示');
  runDemoStep(0, false);
}
function stopDemo(manual) {
  if (!demo.on) return;
  demo.on = false;
  playIcon.innerHTML = '<path d="M6 4l10 6-10 6V4Z"/>';
  playBtn.setAttribute('aria-label', '播放拆解演示');
  if (manual) setCaption('手动模式：拖拽旋转 · 滚轮缩放 · 点击部件查看参数');
}
playBtn.addEventListener('click', function () { demo.on ? stopDemo(false) : startDemo(); });

explEl.addEventListener('input', function () {
  explodeTarget = parseFloat(explEl.value) / 100;
  cam.userZoom = false;
  stopDemo(true);
  refitLater = true;
});
var refitLater = false;

/* =====================================================================
   主循环
   ===================================================================== */
var lastT = performance.now(), frames = 0, slow = 0, pr = Math.min(window.devicePixelRatio || 1, 2);
function resize() {
  var r = stage.getBoundingClientRect();
  var w = Math.max(1, r.width), h = Math.max(1, r.height);
  renderer.setSize(w, h, false);
  camera.aspect = w / h;
  camera.updateProjectionMatrix();
}
window.addEventListener('resize', resize);

function frame(now) {
  var dt = Math.min(0.05, (now - lastT) / 1000); lastT = now;

  // 演示推进
  if (demo.on) {
    demo.t += dt;
    var cur = DEMO[demo.idx];
    if (demo.t > cur.dur) {
      demo.idx = (demo.idx + 1) % DEMO.length;
      demo.t = 0;
      runDemoStep(demo.idx, false);
    }
  }

  // 自动旋转
  if (cam.spin) cam.tTheta += dt * 0.16;

  // 相机方向变化时重算取景
  if (Math.abs(cam.tTheta - cam.theta) + Math.abs(cam.tPhi - cam.phi) > 0.002) refit(false);

  // 相机阻尼
  var k = 1 - Math.pow(0.0016, dt);
  cam.theta += (cam.tTheta - cam.theta) * k;
  cam.phi += (cam.tPhi - cam.phi) * k;
  cam.dist += (cam.tDist - cam.dist) * k;
  cam.target.lerp(cam.tTarget, k);
  camera.position.set(
    cam.target.x + cam.dist * Math.cos(cam.phi) * Math.sin(cam.theta),
    cam.target.y + cam.dist * Math.sin(cam.phi),
    cam.target.z + cam.dist * Math.cos(cam.phi) * Math.cos(cam.theta)
  );
  camera.lookAt(cam.target);

  // 拆解插值
  var prevExplode = explode;
  explode += (explodeTarget - explode) * (1 - Math.pow(0.004, dt));
  if (Math.abs(explodeTarget - explode) > 0.0004) updateExplode(explode);
  if (Math.abs(prevExplode - explode) > 0.0005) refit(false);
  if (!cam.userZoom && Math.abs(cam.tDist - fitBase * viewZoom) > 0.5) {
    if (!viewTarget) cam.tTarget.lerp(fitCenter, 0.12);
    cam.tDist += (fitBase * viewZoom - cam.tDist) * 0.1;
  }
  explEl.value = String(Math.round(explode * 100));
  explEl.style.setProperty('--pct', (explode * 100).toFixed(1) + '%');
  pctEl.textContent = Math.round(explode * 100) + '%';

  // 羽流：时间驱动闪烁，拆解时减弱
  if (plume && plume.material.uniforms) {
    plume.material.uniforms.uTime.value = now * 0.001;
    plume.material.uniforms.uOpacity.value = (1 - 0.55 * explode) * (plumeOn ? 1 : 0);
  }

  renderer.render(scene, camera);
  layoutLabels();
  layoutDims();

  // 性能自适应
  frames++;
  if (dt > 0.045) slow++; else slow = Math.max(0, slow - 0.5);
  if (slow > 90 && pr > 1) { pr = 1; renderer.setPixelRatio(1); slow = 0; }

  requestAnimationFrame(frame);
}

(function initFromURL() {
  var q = new URLSearchParams(location.search);
  if (q.has('e')) { explode = Math.min(1, Math.max(0, parseFloat(q.get('e')) / 100)); explodeTarget = explode; }
  var instantFit = true;
  var v = q.get('v');
  if (v && VIEWS[v]) applyView(VIEWS[v], true);
  if (q.get('spin') === '0') { cam.spin = false; document.getElementById('tSpin').setAttribute('aria-pressed', 'false'); }
  if (q.has('cut')) { setCut(true); document.getElementById('tCut').setAttribute('aria-pressed', 'true'); }
  if (q.has('wire')) { setWire(true); document.getElementById('tWire').setAttribute('aria-pressed', 'true'); }
  if (q.get('labels') === '0') { showLabels = false; document.getElementById('tLabels').setAttribute('aria-pressed', 'false'); }
  if (q.get('dims') === '0') { showDims = false; document.getElementById('tDims').setAttribute('aria-pressed', 'false'); }
  if (q.get('plume') === '0') { setPlume(false); document.getElementById('tPlume').setAttribute('aria-pressed', 'false'); }
  if (q.get('demo') === '1') { setTimeout(startDemo, 320); return; }
  if (q.has('t')) cam.tTheta = cam.theta = parseFloat(q.get('t'));
  if (q.has('p')) cam.tPhi = cam.phi = parseFloat(q.get('p'));
  if (q.has('tx')) { cam.tTarget.x = cam.target.x = parseFloat(q.get('tx')); viewTarget = cam.tTarget.clone(); }
  if (q.has('ty')) { cam.tTarget.y = cam.target.y = parseFloat(q.get('ty')); viewTarget = cam.tTarget.clone(); }
  if (q.has('d')) { cam.tDist = cam.dist = parseFloat(q.get('d')); cam.userZoom = true; }
  if (q.get('debug') === '1') window.__dbg = true;
  if (q.get('fit') !== '0') { refit(true, 1.12); if (!viewTarget) cam.tTarget.copy(fitCenter); }
  if (instantFit) { cam.dist = cam.tDist; cam.target.copy(cam.tTarget); }
})();
updateExplode(explode);
refit(true, cinema ? 0.94 : 0.9);
cam.dist = cam.tDist; cam.target.copy(cam.tTarget);
requestAnimationFrame(function (t) {

});
