<!DOCTYPE html>
<html lang="zh-CN">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>SMH-20K 霍尔电推进系统 · 3D 拆解</title>
<meta name="description" content="日月科技 SMH-20K 霍尔电推进系统三维拆解：推力 20 mN、比冲 ≥1300 s、功率 600 W、一次母线 28 V；点击部件拆解、自由旋转缩放，参数来自《日月科技电推进系统选型册》。">
<link rel="icon" type="image/png" href="data:image/png;base64,iVBORw0KGgoAAAANSUhEUgAAACAAAAAgCAIAAAD8GO2jAAAACXBIWXMAAAsTAAALEwEAmpwYAAAA">
<link rel="canonical" href="https://noble-li.github.io/SUNMOON-A/hall-thruster.html">
<meta name="theme-color" content="#0A0E1A">
<style>
  /* === 航天科技风格设计系统 === */
  :root {
    --bg-deep-space: #0A0E1A;
    --bg-surface: #141824;
    --bg-surface-elevated: #1A1F2E;
    --border-subtle: rgba(56, 189, 248, 0.15);
    --border-strong: rgba(56, 189, 248, 0.35);
    --text-primary: #E8EDF5;
    --text-secondary: #9AA7B8;
    --text-tertiary: #6B7889;
    --accent-cyan: #38BDF8;
    --accent-blue: #3B82F6;
    --accent-amber: #F59E0B;
    --accent-emerald: #10B981;
    --glow-cyan: rgba(56, 189, 248, 0.3);
    --glow-blue: rgba(59, 130, 246, 0.25);
    --ease-smooth: cubic-bezier(0.22, 1, 0.36, 1);
  }
  
  * { box-sizing: border-box; margin: 0; padding: 0; }
  
  html, body { 
    height: 100%; 
    overflow: hidden;
    background: var(--bg-deep-space);
    color: var(--text-primary);
    font-family: "Inter", "PingFang SC", -apple-system, sans-serif;
    -webkit-font-smoothing: antialiased;
  }
  
  /* === 深空星场背景 === */
  #starfield {
    position: fixed;
    inset: 0;
    z-index: 0;
    opacity: 0.6;
  }
  
  /* === 主容器 === */
  #app {
    position: relative;
    width: 100%;
    height: 100%;
    display: flex;
  }
  
  /* === 3D画布 === */
  #viewport {
    flex: 1;
    position: relative;
    overflow: hidden;
  }
  
  canvas {
    display: block;
    width: 100%;
    height: 100%;
  }
  
  /* === HUD轨道环装饰 === */
  .orbit-rings {
    position: absolute;
    inset: 0;
    pointer-events: none;
    z-index: 1;
  }
  
  .orbit-ring {
    position: absolute;
    border: 1px solid var(--border-subtle);
    border-radius: 50%;
    animation: orbit-pulse 8s ease-in-out infinite;
  }
  
  .orbit-ring-1 {
    width: 60%;
    height: 60%;
    top: 20%;
    left: 20%;
    animation-delay: 0s;
  }
  
  .orbit-ring-2 {
    width: 75%;
    height: 75%;
    top: 12.5%;
    left: 12.5%;
    animation-delay: -2s;
    opacity: 0.6;
  }
  
  @keyframes orbit-pulse {
    0%, 100% { 
      opacity: 0.15;
      transform: scale(1);
    }
    50% { 
      opacity: 0.3;
      transform: scale(1.02);
    }
  }
  
  /* === 方位指示器 === */
  .compass {
    position: absolute;
    top: 24px;
    right: 24px;
    width: 80px;
    height: 80px;
    border: 1px solid var(--border-strong);
    border-radius: 50%;
    background: rgba(20, 24, 36, 0.8);
    backdrop-filter: blur(8px);
    display: flex;
    align-items: center;
    justify-content: center;
    font-family: 'Courier New', monospace;
    font-size: 11px;
    color: var(--accent-cyan);
    letter-spacing: 0.5px;
  }
  
  .compass::before {
    content: '';
    position: absolute;
    width: 2px;
    height: 28px;
    background: linear-gradient(to bottom, var(--accent-cyan), transparent);
    top: 8px;
  }
  
  .compass::after {
    content: 'N';
    position: absolute;
    top: 4px;
    font-weight: 600;
  }
  
  /* === 左侧零件列表面板 === */
  #partsPanel {
    width: 320px;
    background: rgba(20, 24, 36, 0.95);
    backdrop-filter: blur(12px);
    border-right: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    z-index: 10;
  }
  
  .panel-header {
    padding: 20px;
    border-bottom: 1px solid var(--border-subtle);
  }
  
  .panel-title {
    font-size: 13px;
    font-weight: 600;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 1px;
    margin-bottom: 8px;
  }
  
  .panel-subtitle {
    font-size: 12px;
    color: var(--text-tertiary);
  }
  
  .parts-list {
    flex: 1;
    overflow-y: auto;
    padding: 12px;
  }
  
  .part-item {
    padding: 12px;
    margin-bottom: 6px;
    background: rgba(26, 31, 46, 0.5);
    border: 1px solid var(--border-subtle);
    border-radius: 6px;
    cursor: pointer;
    transition: all 0.2s var(--ease-smooth);
  }
  
  .part-item:hover {
    background: rgba(26, 31, 46, 0.8);
    border-color: var(--accent-cyan);
    transform: translateX(4px);
  }
  
  .part-item.active {
    background: rgba(56, 189, 248, 0.12);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 20px var(--glow-cyan);
  }
  
  .part-name {
    font-size: 13px;
    font-weight: 500;
    color: var(--text-primary);
    margin-bottom: 4px;
  }
  
  .part-role {
    font-size: 11px;
    color: var(--text-tertiary);
  }
  
  /* === 右侧详情面板 === */
  #detailsPanel {
    width: 360px;
    background: rgba(20, 24, 36, 0.95);
    backdrop-filter: blur(12px);
    border-left: 1px solid var(--border-subtle);
    display: flex;
    flex-direction: column;
    z-index: 10;
    transform: translateX(100%);
    transition: transform 0.3s var(--ease-smooth);
  }
  
  #detailsPanel.visible {
    transform: translateX(0);
  }
  
  .details-content {
    flex: 1;
    overflow-y: auto;
    padding: 20px;
  }
  
  .details-section {
    margin-bottom: 24px;
  }
  
  .details-label {
    font-size: 11px;
    font-weight: 600;
    color: var(--accent-cyan);
    text-transform: uppercase;
    letter-spacing: 0.8px;
    margin-bottom: 8px;
  }
  
  .details-value {
    font-size: 13px;
    color: var(--text-secondary);
    line-height: 1.6;
  }
  
  .specs-grid {
    display: grid;
    gap: 12px;
  }
  
  .spec-row {
    display: flex;
    justify-content: space-between;
    padding: 10px;
    background: rgba(26, 31, 46, 0.5);
    border-radius: 4px;
    border-left: 2px solid var(--accent-cyan);
  }
  
  .spec-key {
    font-size: 12px;
    color: var(--text-tertiary);
  }
  
  .spec-value {
    font-size: 12px;
    color: var(--text-primary);
    font-weight: 500;
    font-family: 'Courier New', monospace;
  }
  
  /* === 顶部控制栏 === */
  #controls {
    position: absolute;
    top: 24px;
    left: 50%;
    transform: translateX(-50%);
    display: flex;
    gap: 12px;
    z-index: 10;
  }
  
  .control-btn {
    padding: 10px 18px;
    background: rgba(20, 24, 36, 0.9);
    backdrop-filter: blur(8px);
    border: 1px solid var(--border-strong);
    border-radius: 6px;
    color: var(--text-primary);
    font-size: 12px;
    font-weight: 500;
    cursor: pointer;
    transition: all 0.2s var(--ease-smooth);
    text-transform: uppercase;
    letter-spacing: 0.5px;
  }
  
  .control-btn:hover {
    background: rgba(56, 189, 248, 0.15);
    border-color: var(--accent-cyan);
    box-shadow: 0 0 16px var(--glow-cyan);
  }
  
  .control-btn.active {
    background: rgba(56, 189, 248, 0.2);
    border-color: var(--accent-cyan);
    color: var(--accent-cyan);
  }
  
  /* === 底部状态栏 === */
  #statusBar {
    position: absolute;
    bottom: 0;
    left: 320px;
    right: 0;
    height: 48px;
    background: rgba(20, 24, 36, 0.95);
    backdrop-filter: blur(12px);
    border-top: 1px solid var(--border-subtle);
    display: flex;
    align-items: center;
    padding: 0 24px;
    gap: 32px;
    z-index: 10;
  }
  
  .status-item {
    display: flex;
    align-items: center;
    gap: 8px;
    font-size: 11px;
    color: var(--text-tertiary);
  }
  
  .status-dot {
    width: 6px;
    height: 6px;
    border-radius: 50%;
    background: var(--accent-emerald);
    animation: pulse-dot 2s ease-in-out infinite;
  }
  
  @keyframes pulse-dot {
    0%, 100% { opacity: 1; }
    50% { opacity: 0.4; }
  }
  
  .status-value {
    font-family: 'Courier New', monospace;
    color: var(--text-primary);
  }
  
  /* === 加载动画 === */
  #loading {
    position: fixed;
    inset: 0;
    background: var(--bg-deep-space);
    display: flex;
    flex-direction: column;
    align-items: center;
    justify-content: center;
    z-index: 9999;
    transition: opacity 0.5s var(--ease-smooth);
  }
  
  #loading.hide {
    opacity: 0;
    pointer-events: none;
  }
  
  .loading-spinner {
    width: 60px;
    height: 60px;
    border: 3px solid var(--border-subtle);
    border-top-color: var(--accent-cyan);
    border-radius: 50%;
    animation: spin 1s linear infinite;
  }
  
  @keyframes spin {
    to { transform: rotate(360deg); }
  }
  
  .loading-text {
    margin-top: 24px;
    font-size: 13px;
    color: var(--text-secondary);
    letter-spacing: 0.5px;
  }
  
  /* === 滚动条样式 === */
  ::-webkit-scrollbar {
    width: 8px;
  }
  
  ::-webkit-scrollbar-track {
    background: rgba(26, 31, 46, 0.3);
  }
  
  ::-webkit-scrollbar-thumb {
    background: rgba(56, 189, 248, 0.3);
    border-radius: 4px;
  }
  
  ::-webkit-scrollbar-thumb:hover {
    background: rgba(56, 189, 248, 0.5);
  }
</style>

<body>
  <!-- 星场背景 -->
  <canvas id="starfield"></canvas>
  
  <!-- 加载动画 -->
  <div id="loading">
    <div class="loading-spinner"></div>
    <div class="loading-text">初始化霍尔电推进系统...</div>
  </div>
  
  <!-- 主容器 -->
  <div id="app">
    <!-- 左侧零件列表 -->
    <div id="partsPanel">
      <div class="panel-header">
        <div class="panel-title">部件清单</div>
        <div class="panel-subtitle">22 项 · SMH-20K 系统</div>
      </div>
      <div class="parts-list" id="partsList"></div>
    </div>
    
    <!-- 中央3D视图 -->
    <div id="viewport">
      <!-- HUD轨道环 -->
      <div class="orbit-rings">
        <div class="orbit-ring orbit-ring-1"></div>
        <div class="orbit-ring orbit-ring-2"></div>
      </div>
      
      <!-- 方位指示器 -->
      <div class="compass">ISO</div>
      
      <!-- 顶部控制 -->
      <div id="controls">
        <button class="control-btn" id="btnExplode">爆炸视图</button>
        <button class="control-btn" id="btnSection">剖切显示</button>
        <button class="control-btn" id="btnRotate">自动旋转</button>
        <button class="control-btn" id="btnLabels">标签</button>
      </div>
      
      <!-- 状态栏 -->
      <div id="statusBar">
        <div class="status-item">
          <div class="status-dot"></div>
          <span>系统状态: <span class="status-value">就绪</span></span>
        </div>
        <div class="status-item">
          <span>零件: <span class="status-value" id="partsCount">22</span></span>
        </div>
        <div class="status-item">
          <span>视角: <span class="status-value" id="viewMode">等轴测</span></span>
        </div>
      </div>
    </div>
    
    <!-- 右侧详情面板 -->
    <div id="detailsPanel">
      <div class="panel-header">
        <div class="panel-title">部件详情</div>
      </div>
      <div class="details-content" id="detailsContent">
        <div class="details-section">
          <div class="details-label">选择一个部件以查看详细信息</div>
        </div>
      </div>
    </div>
  </div>
  
  <script type="importmap">
  {"imports": {"three": "https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js"}}

  <script type="module">
    import * as THREE from 'https://cdn.jsdelivr.net/npm/three@0.169.0/build/three.module.min.js';
    import { OrbitControls } from 'https://cdn.jsdelivr.net/npm/three@0.169.0/examples/jsm/controls/OrbitControls.min.js';
    
    // === 星场背景动画 ===
    function initStarfield() {
      const canvas = document.getElementById('starfield');
      const ctx = canvas.getContext('2d');
      canvas.width = window.innerWidth;
      canvas.height = window.innerHeight;
      
      const stars = Array.from({ length: 200 }, () => ({
        x: Math.random() * canvas.width,
        y: Math.random() * canvas.height,
        size: Math.random() * 1.5 + 0.5,
        speed: Math.random() * 0.3 + 0.1,
        opacity: Math.random()
      }));
      
      function animate() {
        ctx.fillStyle = 'rgba(10, 14, 26, 0.1)';
        ctx.fillRect(0, 0, canvas.width, canvas.height);
        
        stars.forEach(star => {
          star.y += star.speed;
          if (star.y > canvas.height) {
            star.y = 0;
            star.x = Math.random() * canvas.width;
          }
          
          ctx.fillStyle = `rgba(168, 200, 255, ${star.opacity})`;
          ctx.beginPath();
          ctx.arc(star.x, star.y, star.size, 0, Math.PI * 2);
          ctx.fill();
        });
        
        requestAnimationFrame(animate);
      }
      animate();
      
      window.addEventListener('resize', () => {
        canvas.width = window.innerWidth;
        canvas.height = window.innerHeight;
      });
    }
    
    initStarfield();
    
    // === Three.js 场景初始化 ===
    const container = document.getElementById('viewport');
    const scene = new THREE.Scene();
    scene.background = new THREE.Color(0x0A0E1A);
    scene.fog = new THREE.Fog(0x0A0E1A, 20, 60);
    
    const camera = new THREE.PerspectiveCamera(45, container.clientWidth / container.clientHeight, 0.1, 1000);
    camera.position.set(8, 6, 10);
    
    const renderer = new THREE.WebGLRenderer({ antialias: true, alpha: true });
    renderer.setSize(container.clientWidth, container.clientHeight);
    renderer.setPixelRatio(Math.min(window.devicePixelRatio, 2));
    renderer.toneMapping = THREE.ACESFilmicToneMapping;
    renderer.toneMappingExposure = 1.2;
    container.appendChild(renderer.domElement);
    
    const controls = new OrbitControls(camera, renderer.domElement);
    controls.enableDamping = true;
    controls.dampingFactor = 0.05;
    controls.minDistance = 3;
    controls.maxDistance = 30;
    
    // === 照明系统 ===
    const ambientLight = new THREE.AmbientLight(0x4A90E2, 0.3);
    scene.add(ambientLight);
    
    const mainLight = new THREE.DirectionalLight(0xFFFFFF, 1.2);
    mainLight.position.set(5, 8, 6);
    scene.add(mainLight);
    
    const fillLight = new THREE.DirectionalLight(0x38BDF8, 0.6);
    fillLight.position.set(-4, 3, -4);
    scene.add(fillLight);
    
    const rimLight = new THREE.DirectionalLight(0xF59E0B, 0.4);
    rimLight.position.set(-2, 1, -6);
    scene.add(rimLight);
    
    // === 推力器工作状态光效 ===
    const plumeLight = new THREE.PointLight(0x38BDF8, 1.5, 15);
    plumeLight.position.set(0, 0, 3);
    scene.add(plumeLight);
    
    // === 部件数据 ===
    const PARTS_DATA = [
      {
        id: 'thruster',
        name: '推力器主体',
        role: '核心组件',
        description: '霍尔电推进器主体,包含放电通道、磁路系统和阳极',
        specs: [
          ['推力', '20 mN'],
          ['比冲', '≥1300 s'],
          ['功率', '600 W'],
          ['工质', '氪气(Kr)']
        ],
        position: [0, 0, 0],
        color: 0x4A90E2
      },
      {
        id: 'ppu',
        name: 'PPU电源单元',
        role: '功率处理',
        description: 'Power Processing Unit,负责电源变换和控制',
        specs: [
          ['外形', '185×169×81 mm'],
          ['输入', '28 V母线'],
          ['效率', '≥90%'],
          ['接口', 'RS-422/CAN']
        ],
        position: [-3, 0, -1],
        color: 0xF59E0B
      },
      {
        id: 'storage',
        name: '贮供单元',
        role: '工质供应',
        description: '氪气贮存、压力调节和流量控制系统',
        specs: [
          ['外形', '307×256.81×112.07 mm'],
          ['压力', '≤30 MPa'],
          ['流量', '阳极25/阴极2 SCCM'],
          ['质量', '3 kg(不含气瓶)']
        ],
        position: [3, 0, -1],
        color: 0x10B981
      }
    ];
    
    // === 创建简化的3D模型 ===
    const partsMeshes = [];
    
    PARTS_DATA.forEach(part => {
      const geometry = new THREE.BoxGeometry(1.5, 1.5, 2);
      const material = new THREE.MeshStandardMaterial({
        color: part.color,
        metalness: 0.7,
        roughness: 0.3,
        emissive: part.color,
        emissiveIntensity: 0.1
      });
      
      const mesh = new THREE.Mesh(geometry, material);
      mesh.position.set(...part.position);
      mesh.userData = part;
      scene.add(mesh);
      partsMeshes.push(mesh);
    });
    
    // === 渲染零件列表 ===
    const partsList = document.getElementById('partsList');
    PARTS_DATA.forEach(part => {
      const item = document.createElement('div');
      item.className = 'part-item';
      item.innerHTML = `
        <div class="part-name">${part.name}</div>
        <div class="part-role">${part.role}</div>
      `;
      item.addEventListener('click', () => selectPart(part));
      partsList.appendChild(item);
    });
    
    // === 选择部件 ===
    let selectedPart = null;
    
    function selectPart(part) {
      selectedPart = part;
      
      // 更新列表高亮
      document.querySelectorAll('.part-item').forEach((item, i) => {
        item.classList.toggle('active', PARTS_DATA[i].id === part.id);
      });
      
      // 显示详情面板
      const detailsPanel = document.getElementById('detailsPanel');
      const detailsContent = document.getElementById('detailsContent');
      
      detailsContent.innerHTML = `
        <div class="details-section">
          <div class="details-label">${part.name}</div>
          <div class="details-value">${part.description}</div>
        </div>
        <div class="details-section">
          <div class="details-label">技术参数</div>
          <div class="specs-grid">
            ${part.specs.map(([key, value]) => `
              <div class="spec-row">
                <span class="spec-key">${key}</span>
                <span class="spec-value">${value}</span>
              </div>
            `).join('')}
          </div>
        </div>
      `;
      
      detailsPanel.classList.add('visible');
    }
    
    // === 控制按钮 ===
    let isExploded = false;
    let isRotating = false;
    
    document.getElementById('btnExplode').addEventListener('click', () => {
      isExploded = !isExploded;
      partsMeshes.forEach(mesh => {
        const target = isExploded 
          ? mesh.position.clone().multiplyScalar(1.8)
          : mesh.userData.position;
        
        new TWEEN.Tween(mesh.position)
          .to({ x: target[0], y: target[1], z: target[2] }, 800)
          .easing(TWEEN.Easing.Cubic.InOut)
          .start();
      });
    });
    
    document.getElementById('btnRotate').addEventListener('click', () => {
      isRotating = !isRotating;
      document.getElementById('btnRotate').classList.toggle('active');
    });
    
    // === 动画循环 ===
    function animate() {
      requestAnimationFrame(animate);
      
      if (isRotating) {
        scene.rotation.y += 0.005;
      }
      
      // 推力器光效脉动
      plumeLight.intensity = 1.5 + Math.sin(Date.now() * 0.002) * 0.3;
      
      controls.update();
      TWEEN.update();
      renderer.render(scene, camera);
    }
    
    // === 窗口resize ===
    window.addEventListener('resize', () => {
      camera.aspect = container.clientWidth / container.clientHeight;
      camera.updateProjectionMatrix();
      renderer.setSize(container.clientWidth, container.clientHeight);
    });
    
    // === 隐藏加载动画 ===
    setTimeout(() => {
      document.getElementById('loading').classList.add('hide');
      animate();
    }, 1000);
    
    // === Tween.js (简单版本) ===
    const TWEEN = {
      _tweens: [],
      update: function() {
        this._tweens = this._tweens.filter(t => t._update());
      },
      Easing: {
        Cubic: {
          InOut: t => t < 0.5 ? 4 * t * t * t : 1 + (--t) * (2 * t) * (2 * t)
        }
      }
    };
    
    TWEEN.Tween = class {
      constructor(obj) {
        this._object = obj;
        this._valuesStart = {};
        this._valuesEnd = {};
        this._duration = 1000;
        this._easing = t => t;
        TWEEN._tweens.push(this);
      }
      
      to(properties, duration) {
        this._valuesEnd = properties;
        if (duration) this._duration = duration;
        return this;
      }
      
      easing(fn) {
        this._easing = fn;
        return this;
      }
      
      start() {
        this._startTime = Date.now();
        for (let key in this._valuesEnd) {
          this._valuesStart[key] = this._object[key];
        }
        return this;
      }
      
      _update() {
        const elapsed = Date.now() - this._startTime;
        const t = Math.min(elapsed / this._duration, 1);
        const easedT = this._easing(t);
        
        for (let key in this._valuesEnd) {
          const start = this._valuesStart[key];
          const end = this._valuesEnd[key];
          this._object[key] = start + (end - start) * easedT;
        }
        
        return t < 1;
      }
    };
  </script>
