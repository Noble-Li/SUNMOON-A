name: 日报哨兵

on:
  schedule:
    # 每天 09:00 北京时间（= 01:00 UTC）。排在 08:00 自动更新之后一小时做复核：
    # 更新成功就只记一次正常巡检，更新失败才兜底补登并告警。
    # GitHub cron 可能有 5~30 分钟延迟，属正常。
    - cron: '0 1 * * *'
  workflow_dispatch:
    inputs:
      force_alert:
        description: '强制发一条提醒（用于验证通知链路是否正常）'
        type: boolean
        default: false

permissions:
  contents: write
  issues: write

jobs:
  watch:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 运行哨兵
        id: watch
        env:
          WATCHMAN_DEBUG: '1'
          FORCE_ALERT: '${{ inputs.force_alert }}'
        run: python scripts/watchman.py

      - name: 发送提醒
        # Issues 若被关闭也不允许让整个 job 失败 —— 提醒失败不等于断更没检测到
        continue-on-error: true
        if: steps.watch.outputs.need_alert == 'true'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          # 仓库可能关闭了 Issues，先探一下
          if ! gh issue list --limit 1 >/dev/null 2>&1; then
            echo "::warning::仓库未启用 Issues，改为写入 ALERT.md 提醒"
            {
              echo "# $(cat .watch_out/issue_title.txt)"
              echo
              echo "> 本文件由云端哨兵自动生成（仓库未启用 Issues，改用文件提醒）。"
              echo "> 生成时间：$(date -u -d '+8 hours' '+%F %H:%M') 北京时间"
              echo
              cat .watch_out/issue_body.md
            } > ALERT.md
            exit 0
          fi
          gh label create daily-watch --description "云端哨兵提醒" --color ededed 2>/dev/null || true
          TITLE=$(cat .watch_out/issue_title.txt)
          TODAY=$(date -u -d '+8 hours' +%F)
          EXISTING=$(gh issue list --label daily-watch --state open --search "$TODAY" --json title --jq '.[].title' | head -1)
          if [ -n "$EXISTING" ]; then
            echo "今日已有提醒 Issue：$EXISTING，追加评论"
            gh issue comment "$EXISTING" --body-file .watch_out/issue_body.md
          else
            gh issue create --title "$TITLE" --body-file .watch_out/issue_body.md --label daily-watch
            echo "已创建提醒 Issue"
          fi

      - name: 断更恢复后自动关单
        # 台账已经不落后（含云端兜底补登成功）时，把此前遗留的断更提醒关掉，
        # 避免 issue 列表里堆着早已失效的告警、看不出当前真实状态。
        continue-on-error: true
        if: steps.watch.outputs.stale_days == '0' || steps.watch.outputs.backfill == 'wrote'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          set +e
          if ! gh issue list --limit 1 >/dev/null 2>&1; then
            echo "::warning::仓库未启用 Issues，跳过关单"
            exit 0
          fi
          OPEN=$(gh issue list --label daily-watch --state open --json number --jq '.[].number')
          if [ -z "$OPEN" ]; then
            echo "没有待关闭的断更提醒"
            exit 0
          fi
          for n in $OPEN; do
            gh issue close "$n" --comment "台账已补登至 $(date -u -d '+8 hours' +%F)（本次运行 stale_days=${{ steps.watch.outputs.stale_days }}，backfill=${{ steps.watch.outputs.backfill }}），自动关闭本条提醒。" || true
          done

      - name: 提交线索
        # 放在“发送提醒”之后，这样 Issues 不可用时的 ALERT.md 也能一并提交
        run: |
          git config user.name "sunmoon-watchman"
          git config user.email "watchman@users.noreply.github.com"
          if [ -n "$(git status --porcelain)" ]; then
            git add -A
            git commit -m "哨兵更新 $(date -u -d '+8 hours' +%F)"
            git push
            echo "已提交线索"
          else
            echo "无变化，跳过提交"
          fi

      - name: 运行摘要
        if: always()
        run: |
          echo "### 哨兵本次运行结果" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- 新增线索：${{ steps.watch.outputs.added || 0 }}" >> $GITHUB_STEP_SUMMARY
          echo "- 兜底补登：${{ steps.watch.outputs.backfill || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- 日报落后天数：${{ steps.watch.outputs.stale_days || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
          echo "- ccgp 是否被限流：${{ steps.watch.outputs.ccgp_blocked || 'n/a' }}" >> $GITHUB_STEP_SUMMARY
