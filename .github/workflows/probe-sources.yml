name: 通道探测（一次性诊断）

# 回答一个问题：GitHub Actions 的出口 IP 能不能读到政采网搜索结果？
# 这决定了「早八点自动更新」该由云端跑还是必须由本机跑。
# 诊断完可以直接删除本文件。

on:
  workflow_dispatch:

jobs:
  probe:
    runs-on: ubuntu-latest
    steps:
      - name: 检出仓库
        uses: actions/checkout@v4

      - name: 准备 Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 逐个通道探测
        run: python scripts/probe_sources.py
